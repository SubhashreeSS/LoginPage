
<div class="parent">
    <div class="container">
        <div class="login-box">
            <h2>Login</h2>
            <form action="#">
                <button type="button" id="googleBtn">Sign in with Google</button>
                <div class="input-box">
                    <input type="email"  name="EmailId" required>
                    <!-- [(ngModel)]="loginObj.EmailId" -->
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <input type="password" name="Password" required>
                    <!-- [(ngModel)]="loginObj.Password"  -->
                    <label>Password</label>
                </div>
                
                <button type="button" class="btn" (click)="onLogin()" >Login</button>
                <div id="buttonDiv"></div> 
            </form>
        </div>
        
    </div>
</div>
